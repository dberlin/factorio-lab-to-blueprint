[project]
name = "flab2bp"
version = "0.1.0"
description = "Convert FactorioLab URLs for Dyson Sphere Program into dense, pasteable DSP blueprints"
readme = "README.md"
authors = [
    { name = "Daniel Berlin", email = "dberlin@dberlin.org" }
]
requires-python = ">=3.12"
dependencies = [
    # ortools provides BOTH the CP-SAT solver (layout) and, via its SCIP/HiGHS
    # backends, the MILP solver (rates).
    #
    # Do NOT add `highspy`. ortools bundles its own HiGHS inside libortools, and
    # the two cannot share a process: import highspy first and ortools resolves
    # HiGHS symbols into the incompatible library (`ImportError: Symbol not
    # found: setLocalOptionValue`); import it second and it segfaults mid-solve,
    # which showed up as the whole suite exiting 139.
    "ortools>=9.10",
    "httpx>=0.27",
    "pydantic>=2.13.4",
]

[project.scripts]
flab2bp = "flab2bp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run must stay fast enough to sit in an edit loop. Solver-heavy
# tests are marked `slow` and excluded here; run them with `-m slow` or
# `-m ""`. `timeout` is a backstop, not a budget -- a CP-SAT test that trips it
# has a bug, because layout tests pass explicit sub-second budgets.
addopts = "-q -n auto -m 'not slow'"
timeout = 30
markers = [
    "network: hits the live FactorioLab dataset; gated on FLAB2BP_NETWORK_TESTS=1",
    "bun: cross-validates against the dsp-blueprint-viewer TypeScript decoder",
    "slow: solver-heavy; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
