<!doctype html>
<meta charset="utf-8">
<title>JSPI probe: can Python block on an async wasm solve?</title>
<pre id="out">running...</pre>
<script type="module">
const out = document.getElementById('out');
window.__probe = { done: false, result: {} };
const R = window.__probe.result;
const show = () => { out.textContent = JSON.stringify(R, null, 2); };

(async () => {
  try {
    R.crossOriginIsolated = self.crossOriginIsolated;
    R.hasSAB = typeof SharedArrayBuffer !== 'undefined';
    R.hasSuspending = typeof WebAssembly.Suspending === 'function';
    R.hardwareConcurrency = navigator.hardwareConcurrency;
    show();

    const { loadPyodide } = await import('./vendor/pyodide/pyodide.mjs');
    let t = performance.now();
    const pyodide = await loadPyodide({ indexURL: './vendor/pyodide/' });
    R.pyodideBootMs = Math.round(performance.now() - t); show();

    R.pyodideRunSync = pyodide.runPython(`
try:
    from pyodide.ffi import run_sync
    "present"
except Exception as e:
    f"absent: {e}"
`);
    show();

    // A trivially async JS function; can Python block on it?
    globalThis.__slowDouble = async (x) => {
      await new Promise(r => setTimeout(r, 10));
      return x * 2;
    };
    try {
      const fn = pyodide.runPython(`
from pyodide.ffi import run_sync
import js
def _probe():
    return run_sync(js.__slowDouble(21))
_probe
`);
      R.runSyncResult = await fn.callPromising();
    } catch (e) {
      R.runSyncError = String(e).slice(0, 400);
    }
    show();

    // Now the real thing: CP-SAT wasm, awaited from inside synchronous Python.
    const { CpSat } = await import('./vendor/ortools/browser/cp-sat.js');
    const model = new Uint8Array(await (await fetch('./models/tiny.pb')).arrayBuffer());
    const params = new Uint8Array(await (await fetch('./models/params_5s_w1.pb')).arrayBuffer());
    globalThis.__cpsatSolve = async (m, p) => CpSat.solveRaw(new Uint8Array(m), new Uint8Array(p));
    pyodide.globals.set('MODEL', pyodide.toPy(model));
    pyodide.globals.set('PARAMS', pyodide.toPy(params));
    t = performance.now();
    try {
      const solveFn = pyodide.runPython(`
from pyodide.ffi import run_sync, to_js
import js

def _deep_solve():
    # Deliberately nested: flab2bp calls solve() from the bottom of a long
    # pure-Python call stack, so the stack switch has to work from there too.
    def inner():
        resp = run_sync(js.__cpsatSolve(to_js(bytes(MODEL)), to_js(bytes(PARAMS))))
        return bytes(resp.to_py())
    def outer():
        return inner()
    raw = outer()
    from ortools.sat import cp_model_pb2
    r = cp_model_pb2.CpSolverResponse()
    r.ParseFromString(raw)
    return f"{cp_model_pb2.CpSolverStatus.Name(r.status)} obj={r.objective_value} bytes={len(raw)}"
_deep_solve
`);
      R.cpsatFromSyncPython = await solveFn.callPromising();
    } catch (e) {
      R.cpsatError = String(e).slice(0, 800);
    }
    R.cpsatMs = Math.round(performance.now() - t);
    R.ok = true;
  } catch (e) {
    R.ok = false;
    R.error = String(e?.stack ? e.stack : e).slice(0, 1500);
  } finally {
    window.__probe.done = true; show();
  }
})();
</script>
