<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flab2bp -- FactorioLab URL to DSP blueprint, entirely in your browser</title>
<link rel="icon" href="data:,">
<script src="./coi-serviceworker.js"></script>
<style>
  :root {
    --bg: #12151a; --panel: #1a1f27; --line: #2c333f; --ink: #e6eaf0;
    --dim: #97a2b3; --accent: #6fd3a2; --warn: #f0c674; --bad: #ef7a7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.page { padding: 18px 24px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; font-weight: 620; letter-spacing: .01em; }
  header.page p { margin: 4px 0 0; color: var(--dim); font-size: 12.5px; }
  main { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 0; min-height: calc(100vh - 74px); }
  .controls { padding: 20px 24px; border-right: 1px solid var(--line); }
  .out { padding: 20px 24px; overflow: auto; }
  .controls label { display: block; margin: 14px 0 5px; font-size: 12px; color: var(--dim);
          text-transform: uppercase; letter-spacing: .06em; }
  textarea, input, select {
    width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font: inherit;
  }
  textarea { min-height: 92px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--ink); }
  .check input { width: auto; }
  button {
    margin-top: 18px; width: 100%; padding: 10px 14px; border-radius: 6px;
    border: 1px solid #2f6b52; background: var(--accent); color: #06130d;
    font: inherit; font-weight: 640; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--ink); border-color: var(--line); }
  #status { margin-top: 14px; font-size: 12.5px; color: var(--dim); min-height: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .05em;
             text-transform: uppercase; color: var(--dim); font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 3px 0; }
  .note { color: var(--dim); font-size: 12.5px; margin: 8px 0 0; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .refusal { border-color: #6a3a3a; }
  .refusal h2 { color: var(--bad); }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; }
  table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  th, td { text-align: left; padding: 3px 10px 3px 0; color: var(--dim); }
  th { color: var(--ink); font-weight: 600; }
  tr.chosen td { color: var(--accent); font-weight: 620; }
  .bar { height: 6px; background: #0c0f13; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar .fill { height: 100%; background: var(--accent); }
  .bp-title { font-size: 15px; font-weight: 640; display: block; margin-bottom: 8px; }
  .blueprint-out { font-family: ui-monospace, monospace; font-size: 11px; }
  #viewer { height: 560px; border-radius: 6px; overflow: hidden; background: #10141a; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
</style>

<header class="page">
  <h1>flab2bp, client-side</h1>
  <p>CPython, CP-SAT and SCIP all run in this tab. The server only ever hands out static files.</p>
</header>

<main>
  <section class="controls">
    <label for="url">FactorioLab URL</label>
    <textarea id="url" spellcheck="false" placeholder="https://factoriolab.github.io/dsp/list?z=..."></textarea>

    <label for="strategy">Layout strategy</label>
    <select id="strategy">
      <option value="best">best -- lay out every candidate both ways, keep the smallest valid</option>
      <option value="freeform">freeform</option>
      <option value="spine">spine</option>
    </select>

    <div class="row2">
      <div>
        <label for="candidates">Proliferation candidates</label>
        <input id="candidates" type="number" min="1" max="8" value="3">
      </div>
      <div>
        <label for="budget">Solver seconds per layout</label>
        <input id="budget" type="number" min="0.2" max="60" step="0.1" value="6">
      </div>
    </div>

    <label for="name">Blueprint short description (optional)</label>
    <input id="name" type="text" placeholder="left blank: named for what it makes">

    <div class="check">
      <input id="power" type="checkbox" checked>
      <label for="power" style="margin:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:14px">Include Tesla Towers</label>
    </div>

    <button type="button" id="solve" disabled>Solve</button>
    <button type="button" id="copy" class="secondary" disabled>Copy blueprint string</button>
    <div id="status">booting...</div>
    <p class="note" id="budget-note"></p>
  </section>

  <section class="out" id="out"></section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const out = $('out');
const statusLine = $('status');

const DEFAULT_URL = 'https://factoriolab.github.io/dsp/list?z=eJxFyr0KwkAQReG3meJWO8GQapq7GDtJBMVt1UUkLoGAEpt5dhH.uo.DGY1naJDReMSiDoC-.Pi7QRU-3KH6HQn6zSTqt7OhlWJEkGIJQS6HbJQpz9Yh4YQBN3ANbsE9ODiviK3HFWLvcSOlTJacvvRe7qb6BOgIKRo_&v=11';
$('url').value = DEFAULT_URL;

// Everything the automated smoke test reads lives here, so the proof does not
// depend on scraping the DOM. `snapshot` is deliberately the SAME object the
// server arm's `/api/build/<id>` returns -- state, elapsed_s, options, result,
// refusal, error, settled -- so the two smoke scripts assert the same fields.
const state = {
  ready: false, booting: true, solving: false, done: false,
  boot: null, snapshot: null, error: null, copied: null, copyError: null,
  wallMs: null, stages: [], progress: null, settled: [],
  viewerMounted: false, viewerError: null,
};
window.__flab = state;

const worker = new Worker('./worker.js', { type: 'module' });

worker.onmessage = (event) => {
  const message = event.data;
  if (message.type === 'stage') {
    state.stages.push(message.text);
    statusLine.textContent = `${message.text}...`;
  } else if (message.type === 'ready') {
    state.ready = true; state.booting = false; state.boot = message;
    $('solve').disabled = false;
    statusLine.textContent =
      `ready in ${(message.timings.totalMs / 1000).toFixed(1)}s ` +
      `(python ${(message.timings.pyodideMs / 1000).toFixed(1)}s, ` +
      `wheels ${(message.timings.packagesMs / 1000).toFixed(1)}s, ` +
      `import ${(message.timings.importMs / 1000).toFixed(1)}s) -- ` +
      `isolated: ${message.crossOriginIsolated}, JSPI: ${message.jspi}`;
  } else if (message.type === 'progress') {
    state.progress = message.step;
    if (message.step.phase !== 'started') state.settled.push(message.step);
    renderProgress();
  } else if (message.type === 'result') {
    state.solving = false; state.done = true;
    state.snapshot = message.snapshot; state.wallMs = message.wallMs;
    $('solve').disabled = false;
    render(message.snapshot, message.wallMs);
  } else if (message.type === 'fatal') {
    // A boot or bridge failure. Not a refusal and not a build error: the
    // pipeline never ran, so there is nothing to report but the stack.
    state.solving = false; state.booting = false; state.done = true;
    state.error = message.error;
    $('solve').disabled = false;
    statusLine.textContent = 'failed';
    out.innerHTML = '';
    out.appendChild(card('Failure', `<pre class="bad">${esc(message.error)}</pre>`, 'refusal'));
  }
};

worker.postMessage({ type: 'boot' });

const options = (extra = {}) => ({
  url: $('url').value.trim(),
  strategy: $('strategy').value,
  candidates: Number($('candidates').value),
  budget: Number($('budget').value),
  power: $('power').checked,
  name: $('name').value,
  allow_invalid: false,
  ...extra,
});

function budgetNote() {
  const o = options();
  const per = o.strategy === 'best' ? 2 : 1;
  $('budget-note').textContent =
    `Budget is per layout, and best lays out every candidate with both strategies -- ` +
    `so ${o.candidates} x ${per} x ${o.budget}s is up to ${o.candidates * per * o.budget}s of ` +
    `solving, plus rates, validation and encoding on top. CP-SAT here gets 4 threads ` +
    `(the wasm runtime's pool), against every core natively, and CP-SAT is a portfolio -- ` +
    `so the same budget buys less search. See docs/WEB_UI.md for what that costs in area.`;
}
for (const id of ['strategy', 'candidates', 'budget']) $(id).oninput = budgetNote;
budgetNote();

function start(extra = {}) {
  state.solving = true; state.done = false; state.snapshot = null; state.error = null;
  state.copied = null; state.copyError = null; state.progress = null; state.settled = [];
  $('solve').disabled = true; $('copy').disabled = true;
  out.innerHTML = '';
  statusLine.textContent = 'solving -- this runs the whole pipeline in this tab...';
  worker.postMessage({ type: 'solve', options: options(extra) });
}

$('solve').onclick = () => start();

$('copy').onclick = async () => {
  const text = state.snapshot?.result?.blueprint;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    state.copied = text;
    statusLine.textContent = `copied ${text.length} characters to the clipboard`;
  } catch (error) {
    // Clipboard permission can be refused; say so rather than pretending.
    state.copied = null;
    state.copyError = String(error);
    statusLine.textContent = `clipboard refused: ${error}`;
  }
};

// `esc`, not `escape`: the global of that name is a deprecated URL encoder,
// and shadowing it makes every call site ambiguous to a reader.
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function card(title, html, cls = '') {
  const el = document.createElement('div');
  el.className = `card ${cls}`;
  el.innerHTML = `<h2>${esc(title)}</h2>${html}`;
  return el;
}

const list = (items, cls = '') =>
  `<ul>${items.map((i) => `<li class="${cls}">${esc(i)}</li>`).join('')}</ul>`;

/**
 * Where the solve is, pair by pair.
 *
 * `pipeline.build` reports each (candidate, strategy) pair as it starts and as
 * it settles, and the worker forwards those straight through. So the bar is a
 * real count of work FINISHED -- 2 of 6 means two pairs are done -- exactly as
 * the server arm's bar is. Before the first pair there is nothing to count:
 * parsing the URL and solving the rates come first and take an unknown time,
 * so the page says that rather than inventing a fraction.
 */
function renderProgress() {
  const step = state.progress;
  const done = state.settled.length;
  let el = document.getElementById('progress');
  if (!el) {
    el = document.createElement('div');
    el.className = 'card';
    el.id = 'progress';
    out.appendChild(el);
  }
  const fraction = step ? done / step.total : 0;
  el.innerHTML =
    `<h2>Progress</h2><p>${step
      ? `Laying out ${esc(step.index)} of ${esc(step.total)}: ` +
        `${esc(step.candidate)} / ${esc(step.strategy)}.`
      : 'Reading the URL and solving the rates...'}</p>` +
    `<div class="bar"><div class="fill" style="width:${(fraction * 100).toFixed(1)}%"></div></div>` +
    (done ? list(state.settled.map((s) => s.phase === 'refused'
      ? `${s.candidate} / ${s.strategy}: no layout -- ${s.reason || 'no reason given'}`
      : `${s.candidate} / ${s.strategy}: ${s.area} tiles, ${s.ok ? 'valid' : 'INVALID'}`)) : '');
}

/**
 * The settled job.
 *
 * Section for section what `web/src/ui/BuildReport.tsx` renders on the server
 * arm, because both are fed by the same `flab2bp.web.payload.describe`. The
 * parts that are easy to leave out are the parts that read as silence: which
 * pairs produced no layout, whether the belt ceiling was READ or ASSUMED,
 * whether the recipe selection was pinned or re-derived, and every validator
 * warning -- a check that RAN and found something to act on.
 */
function render(snapshot, wallMs) {
  out.innerHTML = '';
  const seconds = (wallMs / 1000).toFixed(1);

  if (snapshot.state === 'error') {
    statusLine.textContent = `failed after ${seconds}s`;
    out.appendChild(card('Failure', `<pre class="bad">${esc(snapshot.error)}</pre>` +
      (snapshot.traceback ? `<pre class="note">${esc(snapshot.traceback)}</pre>` : ''), 'refusal'));
    return;
  }

  if (snapshot.state === 'refused') {
    statusLine.textContent = `refused after ${seconds}s`;
    out.appendChild(card('No layout for this spec',
      `<p>${esc(snapshot.refusal.message)}</p>` +
      (snapshot.refusal.reasons.length ? list(snapshot.refusal.reasons) : '') +
      `<p class="note">A refusal is a result, not a crash: each line above is one strategy ` +
      `trying one candidate and saying why it gave up. Raising the budget or the candidate ` +
      `count sometimes helps; a spec that never lays out is more likely a defect in the ` +
      `layout model than a hard instance.</p>`, 'refusal'));
    return;
  }

  const r = snapshot.result;
  statusLine.textContent = `solved in ${seconds}s`;

  // The string first, because it is what the page is for -- but only when
  // there is one. `describe` withholds it from an invalid build, and the way
  // out is an explicit second build, not a quieter message.
  if (r.blueprint) {
    $('copy').disabled = false;
    const head = card(r.title || '(untitled)',
      `<input class="blueprint-out" readonly spellcheck="false" data-testid="blueprint-string" ` +
      `aria-label="blueprint string" value="${esc(r.blueprint)}">`);
    head.querySelector('h2').classList.add('bp-title');
    out.appendChild(head);
  } else {
    const el = card('The string is withheld',
      `<p class="bad">This build did not validate. A blueprint that pastes cleanly and then ` +
      `does not run is worse than not having one, so the string is withheld unless you ask ` +
      `for it.</p><button type="button" id="anyway">Build it anyway and show me the string</button>` +
      `<p class="note">It will paste, and it will not run correctly.</p>`, 'refusal');
    out.appendChild(el);
    el.querySelector('#anyway').onclick = () => start({ allow_invalid: true });
  }

  const inputs = Object.keys(r.external_inputs);
  const makes = Object.entries(r.outputs)
    .map(([item, rate]) => `${item} ${round(rate.per_minute)}/min`).join(', ') || 'nothing declared';
  out.appendChild(card('Build report',
    `<dl>` +
    `<dt>Won with</dt><dd>${esc(r.strategy)} / ${esc(r.candidate)}</dd>` +
    `<dt>Machines</dt><dd>${r.machines}</dd>` +
    `<dt>Area</dt><dd>${r.area} tiles</dd>` +
    `<dt>Buildings</dt><dd>${r.buildings}</dd>` +
    `<dt>Makes</dt><dd>${esc(makes)}</dd>` +
    `<dt>Belt in</dt><dd>${inputs.length ? esc(inputs.join(', ')) +
      ` (${r.input_markers} marked with icons)` : 'nothing'}</dd>` +
    `<dt>Solved in</dt><dd>${seconds}s in this tab</dd>` +
    `</dl>` +
    (r.unmarked_inputs.length
      ? `<p class="warn">No icon placed for ${esc(r.unmarked_inputs.join(', '))} -- ` +
        `those input belts are unlabelled.</p>` : '') +
    flowNote(r) + beltNote(r)));

  // "No differences" and "nothing was checked" read identically in silence,
  // and only one of them is reassuring -- so every one of these prints its
  // section whenever it is non-empty, and nothing collapses them together.
  if (r.refused.length) {
    out.appendChild(card(`${r.refused.length} strategy/candidate pair(s) produced no layout`,
      list(r.refused, 'warn')));
  }
  if (r.report.skipped.length) {
    out.appendChild(card(`${r.report.skipped.length} check(s) could not run`,
      list(r.report.skipped, 'warn')));
  }
  if (r.report.warnings.length) {
    out.appendChild(card(`${r.report.warnings.length} validation warning(s)`,
      `<p class="note">The blueprint is valid and will run; these are things to look at ` +
      `before you paste it.</p>` +
      list(r.report.warnings.map((f) => `${f.check}: ${f.message}`), 'warn')));
  }
  if (r.report.errors.length) {
    out.appendChild(card(`${r.report.errors.length} validation error(s)`,
      list(r.report.errors.map((f) => `${f.check}: ${f.message}`), 'bad'), 'refusal'));
  }
  if (snapshot.runtime_warnings?.length) {
    // The one thing this arm reports that the server arm does not, and the
    // reason is structural rather than an omission: `warnings.catch_warnings`
    // is process-global, and the server runs its builds in a thread pool.
    out.appendChild(card('Python runtime warnings',
      list(snapshot.runtime_warnings, 'warn')));
  }

  if (r.attempts.length > 1) {
    let rows = '<table><tr><th>candidate</th><th>strategy</th><th>area</th><th>errors</th></tr>';
    for (const a of r.attempts) {
      rows += `<tr class="${a.chosen ? 'chosen' : ''}"><td>${esc(a.candidate)}</td>` +
              `<td>${esc(a.strategy)}</td><td>${a.area}</td><td>${a.errors}</td></tr>`;
    }
    out.appendChild(card('Every attempt', `${rows}</table>`));
  }

  if (r.blueprint) mountViewer(r.blueprint, snapshot.viewer);
}

function flowNote(r) {
  if (!r.flow_pinned) {
    return `<p class="note">Recipe selection <strong>derived, not pinned</strong> -- ` +
      `FactorioLab's own choice of which recipe makes what was re-solved here rather than ` +
      `read from a flow export. The CLI's <code>--flow</code> / <code>--fetch-flow</code> ` +
      `pin it; a page cannot, because <code>--fetch-flow</code> drives a headless browser ` +
      `and a page cannot drive one against itself.</p>`;
  }
  if (r.flow_findings.length) {
    return `<p>${r.flow_findings.length} difference(s) from the pinned flow:</p>` +
      list(r.flow_findings, 'warn');
  }
  return `<p class="note">Recipe selection pinned to the supplied flow, no differences.</p>`;
}

function beltNote(r) {
  const b = r.belt_rules;
  if (!b) return '';
  const vertical = b.vertical_construction ? 'yes' : 'no';
  return b.from_url
    ? `<p class="note">Belt ceiling ${b.max_z} (lab level ${b.lab_level}), vertical belt ` +
      `construction ${vertical} -- read from the URL's researched technologies.</p>`
    : `<p class="warn">This URL carried no technology set, so a <strong>fully-researched ` +
      `save is assumed</strong>: belt ceiling ${b.max_z} (lab level ${b.lab_level}), ` +
      `vertical belt construction ${vertical}. If your save is not fully researched, the ` +
      `belts here may climb higher than it allows.</p>`;
}

function round(value) {
  return Number.isInteger(value) ? String(value) : value.toFixed(2).replace(/\.?0+$/, '');
}

/**
 * The server arm's viewer, in this page.
 *
 * Not a second renderer: `web/src/embed.tsx` is built by the same rsbuild
 * config as the server arm's app and exports the same component tree, so both
 * arms draw a result with identical code and only the SOLVING differs. It is
 * handed the exact string the Copy button copies -- and `viewer.buildings`,
 * which Python produced by decoding that same string, is what the count under
 * the canvas reports, so a string that does not decode cannot be drawn.
 */
async function mountViewer(blueprint, viewer) {
  const el = card('Blueprint viewer', `<div id="viewer"></div>` +
    (viewer ? `<p class="note">Drawn from the exact string the Copy button puts on your ` +
      `clipboard. <code>codec.decode()</code> of it, in Python, in this tab, found ` +
      `${viewer.buildings.length} buildings and a ` +
      `${viewer.hashValid ? 'valid' : 'INVALID'} payload hash.</p>` : ''));
  out.appendChild(el);
  const host = el.querySelector('#viewer');
  try {
    if (!window.flab2bpViewer) {
      const manifest = await fetch('./dist/manifest.json');
      if (!manifest.ok) throw new Error(`web/dist is not built (HTTP ${manifest.status})`);
      const entry = (await manifest.json()).entries.embed.initial;
      for (const href of entry.css || []) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `./dist/${href}`;
        document.head.appendChild(link);
      }
      for (const src of entry.js) await import(`./dist/${src}`);
    }
    window.flab2bpViewer.mount(host, { assetBase: './dist/assets' });
    window.flab2bpViewer.load(blueprint);
    state.viewerMounted = true;
  } catch (error) {
    // No silent degradation to a lesser drawing: the arms are being compared,
    // and a page that quietly rendered something else would make the
    // comparison a lie. It says what is missing and how to build it.
    state.viewerError = String(error);
    host.innerHTML = `<p class="bad" style="padding:16px">The viewer bundle is not built, ` +
      `so there is nothing to draw with: ${esc(String(error))}.<br>Run: ` +
      `<code>cd web && bun install && bun run build</code></p>`;
  }
}
</script>
</html>
