<!doctype html>
<meta charset="utf-8">
<title>or-tools-wasm CP-SAT browser probe</title>
<script src="./coi-serviceworker.js"></script>
<pre id="out">running...</pre>
<script type="module">
const out = document.getElementById('out');
const log = [];
function say(s) { log.push(s); out.textContent = log.join('\n'); }
window.__probe = { done: false, log, result: {} };
const R = window.__probe.result;
const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'tiny';
const LIMIT = Number(params.get('limit') || 10);
const MODE = params.get('mode') || 'bridge';   // bridge | main
const WORKERS = Number(params.get('workers') || 0); // 0 = leave default

R.env = {
  crossOriginIsolated: self.crossOriginIsolated,
  hasSAB: typeof SharedArrayBuffer !== 'undefined',
  hardwareConcurrency: navigator.hardwareConcurrency,
  model: MODEL, mode: MODE, limitS: LIMIT, workersRequested: WORKERS,
};
say('env ' + JSON.stringify(R.env));

try { new WebAssembly.Memory({ initial: 256, maximum: 32768, shared: true }); R.sharedMemOk = true; }
catch (e) { R.sharedMemOk = false; R.sharedMemErr = String(e); }
say('shared WebAssembly.Memory creatable: ' + R.sharedMemOk + (R.sharedMemErr || ''));

(async () => {
  try {
    const t0 = performance.now();
    const mod = await import('./vendor/ortools/browser/cp-sat.js');
    R.importMs = Math.round(performance.now() - t0);
    const { CpSat, setWorkerBridgeEnabled, isWorkerBridgeEnabled } = mod;

    if (MODE === 'main') setWorkerBridgeEnabled(false);
    R.bridgeEnabled = isWorkerBridgeEnabled();
    say('worker bridge enabled: ' + R.bridgeEnabled);

    const t1 = performance.now();
    if (!R.bridgeEnabled) {
      // in bridge mode the worker owns the module; loading it here is refused
      await CpSat.loadModule();
    }
    R.loadModuleMs = Math.round(performance.now() - t1);
    say('loadModule OK in ' + R.loadModuleMs + 'ms');

    // real CpModelProto bytes produced by our Python (ortools 9.15 schema)
    const modelBytes = new Uint8Array(await (await fetch('./models/' + MODEL + '.pb')).arrayBuffer());
    R.modelBytes = modelBytes.length;
    say('model ' + MODEL + '.pb = ' + modelBytes.length + ' bytes');

    const v = await CpSat.validate(modelBytes);
    R.validate = v;
    say('validate: ' + JSON.stringify(v));
    R.modelStats = (await CpSat.modelStats(modelBytes)).split('\n').slice(0, 6).join(' | ');
    say('stats: ' + R.modelStats);

    // SatParameters serialized by Python. Hand-rolling this is a trap:
    // max_time_in_seconds is field 36 and num_workers is field 206, not 1 and 8.
    const pName = params.get('params') || ('params_' + LIMIT + 's_w' + (WORKERS || 1) + '.pb');
    const paramBytes = new Uint8Array(await (await fetch('./models/' + pName)).arrayBuffer());
    R.paramFile = pName;
    R.paramBytes = paramBytes.length;
    say('params ' + pName + ' = ' + paramBytes.length + ' bytes');

    // ONE solve: bytes in, bytes out -- the seam, timed.
    const solveLog = [];
    const t2 = performance.now();
    const res = await CpSat.solve(modelBytes, paramBytes, {
      onLog: (m) => { if (solveLog.length < 400) solveLog.push(m); },
    });
    R.solveLog = solveLog;
    R.solveMs = Math.round(performance.now() - t2);
    R.respBytes = res.bytes && res.bytes.length;
    R.status = String(res.response && res.response.status);
    R.objective = res.response && res.response.objectiveValue;
    R.wallTime = res.response && res.response.wallTime;
    R.solutionInfo = res.response && res.response.solutionInfo;
    say('solve -> ' + R.respBytes + ' bytes in ' + R.solveMs + 'ms status=' + R.status +
        ' obj=' + R.objective + ' wasmWall=' + R.wallTime + ' info=' + R.solutionInfo);

    R.ok = true;
  } catch (e) {
    R.ok = false;
    R.error = String(e && e.stack ? e.stack : e);
    say('FAILED ' + R.error);
  } finally {
    window.__probe.done = true;
    say('__done__');
  }
})();
</script>
